# Cloud hosts (Render, etc.) inject the port to bind on via $PORT. Falls back to 8089 locally.
server.port=${PORT:8089}

spring.web.cors.allowed-origin-patterns=*
spring.web.cors.allowed-methods=*
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# DATABASE CONFIGURATION
# Local dev defaults to a local mongod; in the cloud set MONGODB_URI to the MongoDB Atlas
# connection string (mongodb+srv://user:pass@cluster.../). MONGODB_DATABASE overrides the db name.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/}
spring.data.mongodb.database=${MONGODB_DATABASE:RecruitAI}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.embedded.EmbeddedMongoAutoConfiguration

# AI CONFIGURATION
# Secrets come from environment variables — never commit real keys here.
# The previous plaintext OpenAI key was removed; it should be treated as
# COMPROMISED and rotated. It is not used by the app, but set OPENAI_API_KEY if needed.
openai.api.key=${OPENAI_API_KEY:}
spring.application.name=recruitai-agent
logging.level.com.recruitai.agent=DEBUG
logging.file.name=backend.log
spring.data.mongodb.auto-index-creation=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ✅ Gemini Config — get a key at https://aistudio.google.com/apikey
# IMPORTANT: the previous key was DISABLED by Google ("API key reported as leaked")
# because it was committed here in plaintext. Provide a NEW key ONE of two ways:
#   1) (preferred) set an env var before starting the backend:
#        PowerShell:  $env:GEMINI_API_KEY = "AIza...your-new-key"
#   2) or paste it inline as the default after the colon below:
#        gemini.api.key=${GEMINI_API_KEY:AIza...your-new-key}
# If left blank, AI parsing simply falls back to the deterministic parser (no crash).
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.0-flash-001

# ----------------- EMAIL CONFIGURATION -----------------
# Secrets come from environment variables — never commit real credentials here.
# Set MAIL_USERNAME / MAIL_PASSWORD env vars to enable SMTP (email sending is
# currently disabled in the app, so these can stay blank).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true

# ----------------- ZOOM API CONFIGURATION -----------------
# Secrets come from environment variables — never commit real credentials here.
# If left blank, meeting-link generation falls back to a free Jitsi link.
zoom.account.id=${ZOOM_ACCOUNT_ID:}
zoom.client.id=${ZOOM_CLIENT_ID:}
zoom.client.secret=${ZOOM_CLIENT_SECRET:}
zoom.api.base-url=https://api.zoom.us/v2
zoom.oauth.url=https://zoom.us/oauth/token
